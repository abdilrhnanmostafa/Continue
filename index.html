<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#060713">
<title>WASL — وَصْل | تواصل أقرب</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
/* ====== إعدادات الألوان الأساسية ====== */
:root {
  --bg: #060713;
  --card: #101220;
  --text: #f8fafc;
  --muted: #94a3b8;
  --border: #1e293b;
  --primary: #6366f1;
  --primary-glow: #818cf8;
  --accent: #ec4899;
  --accent-glow: #f472b6;
  --gradient: linear-gradient(135deg, #6366f1, #ec4899);
  --radius: 20px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background-color: var(--bg);
  color: var(--text);
  font-family: 'Cairo', sans-serif;
  line-height: 1.6;
  overflow-x: hidden;
}
.hidden { display: none !important; }
button, input, textarea { font-family: inherit; }
button { cursor: pointer; border: none; outline: none; transition: 0.3s; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

/* ====== شاشة تسجيل الدخول ====== */
.auth-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at top left, rgba(99, 102, 241, 0.15), transparent 40%),
              radial-gradient(circle at bottom right, rgba(236, 72, 153, 0.15), transparent 40%),
              var(--bg);
  padding: 20px;
}
.auth-container {
  width: 100%;
  max-width: 400px;
  background: rgba(16, 18, 32, 0.8);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 30px;
  padding: 40px 30px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
}
.auth-brand { text-align: center; margin-bottom: 30px; }
.auth-brand .brand-logo { font-size: 40px; font-weight: 900; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block; }
.auth-tabs { display: flex; background: var(--bg); border-radius: 15px; padding: 5px; margin-bottom: 20px; }
.auth-tabs button { flex: 1; background: transparent; border: none; color: var(--muted); padding: 10px; border-radius: 12px; font-weight: bold; }
.auth-tabs button.active { background: var(--card); color: var(--text); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
.auth-form .field { margin-bottom: 15px; }
.auth-form label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
.auth-form input { width: 100%; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 12px; padding: 14px; color: white; outline: none; }
.auth-form input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
.auth-form .primary-btn { width: 100%; padding: 14px; border-radius: 12px; background: var(--gradient); border: none; color: white; font-weight: bold; font-size: 16px; margin-top: 10px; box-shadow: 0 8px 20px rgba(236, 72, 153, 0.3); }
.notice { font-size: 13px; padding: 10px 12px; border-radius: 11px; margin: 10px 0; display: none; }
.notice.show { display: block; }
.notice.error { background: rgba(220, 38, 38, 0.2); color: #fca5a5; border: 1px solid rgba(220, 38, 38, 0.3); }
.notice.success { background: rgba(34, 197, 94, 0.2); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.3); }

/* ====== الهيكل الرئيسي ====== */
.app-header { position: sticky; top: 0; z-index: 100; background: rgba(6, 7, 19, 0.8); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border); padding: 12px 20px; }
.header-inner { max-width: 600px; margin: auto; display: flex; align-items: center; justify-content: space-between; }
.brand { font-size: 24px; font-weight: 900; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.main-content { max-width: 600px; margin: 0 auto; padding: 20px 15px 100px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
.primary-btn { background: var(--gradient); color: white; border-radius: 12px; font-weight: bold; padding: 10px 20px; }
.primary-btn:hover { filter: brightness(1.1); }

/* ====== شريط التنقل السفلي ====== */
.mobile-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 400px; background: rgba(16, 18, 32, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 25px; display: flex; justify-content: space-around; padding: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); z-index: 100; }
.mobile-nav button { background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; padding: 8px; border-radius: 15px; }
.mobile-nav button.active { color: var(--accent-glow); }
.mobile-nav button.active .nav-icon { background: rgba(236, 72, 153, 0.2); color: var(--accent); transform: translateY(-2px); }
.mobile-nav .nav-icon { font-size: 22px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }

/* ====== القصص (Stories) ====== */
.stories-row { display: flex; gap: 15px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
.stories-row::-webkit-scrollbar { display: none; }
.story { display: flex; flex-direction: column; align-items: center; gap: 5px; background: transparent; color: white; font-size: 12px; min-width: 70px; }
.story-ring { width: 70px; height: 70px; border-radius: 50%; background: var(--gradient); padding: 3px; display: flex; align-items: center; justify-content: center; }
.story .avatar { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--bg); overflow: hidden; display: block; }
.story .avatar img { width: 100%; height: 100%; object-fit: cover; }
.story.add .story-ring { background: var(--border); }

/* ====== المنشورات (Feed) ====== */
.post-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px; margin-bottom: 20px; }
.post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.post-header .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--gradient); padding: 2px; display: block; }
.post-header .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.post-meta { display: flex; flex-direction: column; }
.post-author { font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 4px; }
.post-time { font-size: 11px; color: var(--muted); }
.post-content { font-size: 14px; margin-bottom: 12px; white-space: pre-wrap; }
.post-image { width: 100%; border-radius: 15px; margin-bottom: 12px; object-fit: cover; max-height: 500px; }
.post-actions { display: flex; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 12px; }
.post-action { background: transparent; color: var(--muted); display: flex; align-items: center; gap: 6px; font-size: 13px; }
.post-action:hover, .post-action.liked { color: var(--accent); }

/* ====== الملف الشخصي ====== */
.profile-header { background: radial-gradient(circle at top, rgba(99, 102, 241, 0.2), transparent 60%); padding: 30px 20px; border-radius: var(--radius); margin-bottom: 20px; border: 1px solid var(--border); }
.profile-top { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
.profile-avatar-wrap { position: relative; width: 90px; height: 90px; border-radius: 50%; padding: 3px; background: var(--gradient); box-shadow: 0 0 20px rgba(236, 72, 153, 0.4); }
.profile-avatar-wrap .avatar { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--bg); overflow: hidden; display: block; }
.profile-avatar-wrap .avatar img { width: 100%; height: 100%; object-fit: cover; }
.profile-stats { display: flex; flex: 1; justify-content: space-around; text-align: center; }
.profile-stats .stat { display: flex; flex-direction: column; }
.profile-stats .stat strong { font-size: 18px; font-weight: bold; }
.profile-stats .stat span { font-size: 12px; color: var(--muted); }
.profile-bio { margin-bottom: 20px; }
.profile-bio h2 { font-size: 20px; margin: 0 0 5px; display: flex; align-items: center; gap: 6px; }
.profile-bio p { font-size: 13px; color: var(--muted); margin: 0; }
.profile-buttons { display: flex; gap: 10px; }
.profile-buttons button { flex: 1; padding: 10px; border-radius: 12px; font-weight: bold; font-size: 13px; background: var(--card); color: white; border: 1px solid var(--border); }
.profile-buttons button.primary { background: var(--gradient); border: none; }
.profile-highlights { display: flex; gap: 15px; overflow-x: auto; padding: 10px 0; margin-bottom: 15px; scrollbar-width: none; }
.profile-highlights::-webkit-scrollbar { display: none; }
.highlight-item { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--border); padding: 2px; background: var(--card); flex-shrink: 0; cursor: pointer; }
.highlight-item img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.profile-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
.profile-tab { flex: 1; padding: 12px; background: transparent; color: var(--muted); font-size: 20px; border-bottom: 2px solid transparent; }
.profile-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.profile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.grid-item { aspect-ratio: 1; background: var(--card); overflow: hidden; position: relative; border-radius: 8px; cursor: pointer; }
.grid-item img, .grid-item video { width: 100%; height: 100%; object-fit: cover; }

/* ====== الريلز (Reels) ====== */
.reels-container { height: calc(100vh - 160px); overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; border-radius: var(--radius); position: relative; background: black; }
.reels-container::-webkit-scrollbar { display: none; }
.reel-item { height: 100%; scroll-snap-align: start; position: relative; display: flex; flex-direction: column; justify-content: flex-end; }
.reel-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
.reel-overlay { position: relative; z-index: 2; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%); padding: 20px 15px; display: flex; justify-content: space-between; align-items: flex-end; }
.reel-info { flex: 1; padding-right: 15px; }
.reel-user { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.reel-user .avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid white; overflow: hidden; display: block; }
.reel-user .avatar img { width: 100%; height: 100%; object-fit: cover; }
.reel-desc { font-size: 13px; margin-bottom: 10px; line-height: 1.4; }
.reel-actions { display: flex; flex-direction: column; gap: 15px; align-items: center; }
.reel-action-btn { background: transparent; color: white; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 24px; }
.reel-action-btn span { font-size: 11px; }
.reel-action-btn.liked { color: var(--accent); }

/* ====== المحادثات ====== */
.chat-layout { display: flex; flex-direction: column; height: calc(100vh - 160px); background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
.chat-list { display: flex; flex-direction: column; border-left: 1px solid var(--border); width: 100%; max-height: 35%; overflow-y: auto; }
.chat-person { display: flex; align-items: center; gap: 10px; padding: 12px 15px; background: transparent; border-bottom: 1px solid var(--border); color: var(--text); text-align: right; }
.chat-person.active { background: rgba(99,102,241,0.1); }
.chat-window { flex: 1; display: flex; flex-direction: column; height: 100%; }
.chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
.bubble { max-width: 80%; padding: 10px 14px; border-radius: 15px; background: rgba(255,255,255,0.05); font-size: 14px; word-break: break-word; }
.bubble.mine { background: var(--gradient); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
.bubble audio { width: 100%; margin-top: 5px; outline: none; }
.chat-send { display: flex; gap: 10px; padding: 10px; background: var(--card); border-top: 1px solid var(--border); align-items: center; }
.chat-send input { flex: 1; background: var(--bg); border: 1px solid var(--border); color: white; padding: 12px 15px; border-radius: 20px; outline: none; }
.chat-send button.voice-btn { background: transparent; color: var(--muted); font-size: 20px; padding: 5px; }
.chat-send button.voice-btn.recording { color: #ef4444; animation: pulse 1s infinite; }
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

/* ====== أدوات مساعدة ====== */
.verified-badge { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; border-radius: 50%; background: #3b82f6; color: white; font-size: 9px; font-weight: bold; }
.icon-btn { background: transparent; color: var(--text); font-size: 20px; padding: 5px; }
.empty { text-align: center; color: var(--muted); padding: 40px 20px; }
.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: rgba(236,72,153,0.9); color: white; padding: 10px 20px; border-radius: 20px; z-index: 1000; font-size: 14px; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: opacity 0.3s; }
.toast.hidden { opacity: 0; pointer-events: none; }
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); width: 100%; max-width: 400px; padding: 20px; position: relative; }

@media (min-width: 600px) {
  .chat-layout { flex-direction: row; }
  .chat-list { width: 250px; max-height: 100%; }
}
</style>
</head>
<body>

<!-- ====== شاشة تسجيل الدخول ====== -->
<div id="authScreen" class="auth-screen">
  <div class="auth-container">
    <div class="auth-brand">
      <div class="brand-logo">WASL — وَصْل</div>
      <p style="color:var(--muted); font-size:14px; margin-top:5px;">المسافة بتقصر لما نكون مع بعض 💙</p>
    </div>
    <div class="auth-tabs">
      <button id="loginTab" class="active" type="button">دخول</button>
      <button id="signupTab" type="button">حساب جديد</button>
    </div>
    <div id="authNotice" class="notice"></div>
    <form id="authForm" class="auth-form">
      <div id="nameField" class="field hidden">
        <label for="fullName">الاسم بالكامل</label>
        <input id="fullName" autocomplete="name" placeholder="اكتب اسمك" maxlength="80">
      </div>
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" autocomplete="email" placeholder="name@example.com" required>
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="••••••••" required>
      </div>
      <button id="authSubmit" class="primary-btn" type="submit">تسجيل الدخول</button>
    </form>
  </div>
</div>

<!-- ====== التطبيق الرئيسي ====== -->
<div id="appScreen" class="hidden">
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">WASL</div>
      <div class="header-actions" style="display:flex; gap:10px; align-items:center;">
        <button class="icon-btn" id="headerNotifications">🔔</button>
        <button class="user-chip" id="profileShortcut" style="background:none; border:none; display:flex; align-items:center; gap:5px;">
          <span class="avatar" id="headerAvatar" style="width:32px; height:32px; font-size:14px; border-radius:50%; background:var(--gradient); display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; overflow:hidden;">و</span>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content" id="mainContent">
    <!-- الصفحة الرئيسية -->
    <section id="homePage">
      <div class="stories-row" id="storiesRow"></div>
      <div class="post-card" style="padding:15px; margin-bottom:20px;">
        <textarea id="postText" placeholder="إيه اللي حابب تشاركه النهارده؟" maxlength="5000" style="width:100%; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:15px; color:white; padding:12px; resize:none; min-height:80px; outline:none; font-family:inherit;"></textarea>
        <div id="imagePreviewWrap" class="hidden" style="margin-top:10px; position:relative;">
          <img id="imagePreview" style="width:100%; border-radius:10px; max-height:200px; object-fit:cover;">
          <button type="button" id="removePostImage" style="position:absolute; top:5px; left:5px; background:rgba(0,0,0,0.6); color:white; border-radius:50%; width:25px; height:25px;">✕</button>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
          <label for="postImageFile" style="color:var(--muted); font-size:13px; display:flex; align-items:center; gap:5px; cursor:pointer;">
            📷 إضافة صورة
          </label>
          <input id="postImageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
          <button id="publishBtn" class="primary-btn" style="padding:8px 20px; font-size:13px;">نشر</button>
        </div>
      </div>
      <div id="feed"></div>
    </section>

    <!-- صفحة الريلز -->
    <section id="reelsPage" class="hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
        <h2 style="margin:0;font-size:18px">الريلز</h2>
        <button class="primary-btn" id="uploadReelBtn" style="padding:8px 15px;font-size:13px">+ ريل جديد</button>
      </div>
      <input id="reelFileInput" type="file" accept="video/mp4,video/webm,video/quicktime" hidden>
      <form id="reelUploadForm" class="hidden" style="margin-bottom:15px">
        <textarea id="reelCaption" placeholder="وصف الفيديو..." style="width:100%;background:#101220;border:1px solid #1e293b;color:white;padding:10px;border-radius:10px;margin-bottom:10px;font-family:inherit;"></textarea>
        <button class="primary-btn" id="publishReelBtn" type="submit" style="width:100%">نشر</button>
      </form>
      <div id="reelsFeed" class="reels-container"></div>
    </section>

    <!-- صفحة الرسائل -->
    <section id="messagesPage" class="hidden">
      <div class="chat-layout">
        <div class="chat-list" id="chatList">
          <div class="empty">جاري التحميل…</div>
        </div>
        <div class="chat-window">
          <div id="chatHeader" style="padding:15px; border-bottom:1px solid var(--border); font-weight:bold; color:var(--muted);">اختر صديقاً لبدء المحادثة</div>
          <div id="chatMessages" class="chat-messages">
            <div class="empty">رسائلك ستظهر هنا.</div>
          </div>
          <form id="chatForm" class="chat-send">
            <button type="button" id="recordVoiceBtn" class="voice-btn" disabled>🎤</button>
            <input id="chatInput" maxlength="3000" placeholder="اكتب رسالة…" disabled required>
            <button type="submit" class="primary-btn" id="chatSend" disabled style="padding:10px 15px; border-radius:50%;">➤</button>
          </form>
        </div>
      </div>
    </section>

    <!-- صفحة الملف الشخصي -->
    <section id="profilePage" class="hidden"></section>

    <!-- صفحة الأصدقاء (تستخدم للبحث أيضاً) -->
    <section id="friendsPage" class="hidden">
       <div class="card"><h2 class="panel-title" style="margin-top:0">الأصدقاء 🤝</h2><div id="friendList"><div class="empty">جاري التحميل…</div></div></div>
    </section>

  </main>

  <!-- شريط التنقل السفلي -->
  <nav class="mobile-nav">
    <button class="active" data-page="home"><span class="nav-icon">⌂</span><span>الرئيسية</span></button>
    <button data-page="reels"><span class="nav-icon">▶</span><span>ريلز</span></button>
    <button data-page="messages"><span class="nav-icon">💬</span><span>الرسائل</span></button>
    <button data-page="friends"><span class="nav-icon">👥</span><span>الأصدقاء</span></button>
    <button data-page="profile"><span class="nav-icon">👤</span><span>حسابي</span></button>
  </nav>
</div>

<!-- عناصر مساعدة -->
<div id="modalRoot"></div>
<div id="toast" class="toast hidden" role="status"></div>
<input id="storyFileInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm" hidden>

<script>
(() => {
'use strict';

// ====== إعدادات Supabase ======
const SUPABASE_URL = 'https://mzghenvgjweconmresjo.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_xqeR3GoMGLuzd7s_Ldf_pQ_mEHGbYg-';
const $ = id => document.getElementById(id);
let sb = null, session = null, me = null, authMode = 'login', activePage = 'home';
let profileCache = {}, currentChatUser = null, messageChannel = null, feedChannel = null, toastTimer = null;
let reelsCache = [];
let mediaRecorder = null;
let audioChunks = [];

if (window.supabase?.createClient) {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });
}

// ====== دوال مساعدة ======
function toast(message, ms=3200) {
  const el=$('toast');
  el.textContent=message;
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.add('hidden'),ms);
}
function escapeHTML(v='') { return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name='وَصْل') { return escapeHTML(name.trim().split(/\s+/).slice(0,2).map(s=>s[0]||'').join('') || 'و'); }
function safeImage(url) { try { const u=new URL(url); return ['https:','http:'].includes(u.protocol) ? u.href : ''; } catch { return ''; } }
function avatarHTML(profile, size='') {
  const name = profile?.full_name || profile?.username || 'مستخدم';
  const src = safeImage(profile?.avatar_url||'');
  return `<span class="avatar ${size}">${src?`<img loading="lazy" referrerpolicy="no-referrer" src="${escapeHTML(src)}" alt="">`:initials(name)}</span>`;
}
function verifiedBadge(profile) { return profile?.is_verified===true ? '<span class="verified-badge">✓</span>' : ''; }
function displayName(profile, fallback='مستخدم') { return `${escapeHTML(profile?.full_name||profile?.username||fallback)}${verifiedBadge(profile)}`; }
function userError(err) {
  const m=String(err?.message||'حصل خطأ غير متوقع');
  if(/Invalid login credentials/i.test(m)) return 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
  if(/Email not confirmed/i.test(m)) return 'أكد بريدك الإلكتروني أولاً.';
  if(/fetch/i.test(m)) return 'تعذر الاتصال. راجع الإنترنت.';
  return m;
}
function timeAgo(value) {
  const d=new Date(value), sec=Math.max(0,(Date.now()-d.getTime())/1000);
  if(sec<60)return 'الآن'; if(sec<3600)return `منذ ${Math.floor(sec/60)} د`; if(sec<86400)return `منذ ${Math.floor(sec/3600)} س`; if(sec<604800)return `منذ ${Math.floor(sec/86400)} يوم`; return d.toLocaleDateString('ar-EG');
}

// ====== المصادقة ======
function showNotice(message, type='error') { const n=$('authNotice'); n.textContent=message; n.className='notice show '+type; }
function setAuthMode(mode) {
  authMode=mode;
  $('loginTab').classList.toggle('active',mode==='login');
  $('signupTab').classList.toggle('active',mode==='signup');
  $('nameField').classList.toggle('hidden',mode!=='signup');
  $('authSubmit').textContent=mode==='login'?'تسجيل الدخول':'إنشاء الحساب';
  $('password').autocomplete=mode==='login'?'current-password':'new-password';
  $('authNotice').className='notice';
}
$('loginTab').addEventListener('click',()=>setAuthMode('login'));
$('signupTab').addEventListener('click',()=>setAuthMode('signup'));

$('authForm').addEventListener('submit', async e=>{
  e.preventDefault();
  if(!sb) return showNotice('اربط المشروع بـ Supabase أولًا.');
  const email=$('email').value.trim(), password=$('password').value, name=$('fullName').value.trim();
  if(password.length<8) return showNotice('كلمة المرور لازم تكون 8 أحرف على الأقل.');
  const btn=$('authSubmit'); btn.disabled=true;
  try {
    if(authMode==='signup') {
      if(name.length<2) throw new Error('اكتب اسمك (حرفين على الأقل).');
      const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name}}});
      if(error) throw error;
      if(data.session) await ensureProfile(data.user,name);
      showNotice(data.session?'الحساب اتعمل بنجاح!':'راجع بريدك الإلكتروني لتأكيد الحساب.','success');
      if(data.session) await boot(data.session);
    } else {
      const {data,error}=await sb.auth.signInWithPassword({email,password});
      if(error) throw error;
      await boot(data.session);
    }
  } catch(err) { showNotice(userError(err)); } finally { btn.disabled=false; }
});

async function ensureProfile(user, name='') {
  const row={id:user.id,full_name:name||user.user_metadata?.full_name||user.email?.split('@')[0]||'مستخدم'};
  await sb.from('profiles').upsert(row,{onConflict:'id',ignoreDuplicates:true});
  const {data}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  return data || {...row,username:null,avatar_url:null,bio:null};
}

async function boot(newSession) {
  session=newSession; if(!session?.user) return;
  $('authScreen').classList.add('hidden'); $('appScreen').classList.remove('hidden');
  try { me=await ensureProfile(session.user); } catch(e) { toast('تعذر تحميل الملف الشخصي.'); }
  updateIdentity();
  await loadFeed();
  await loadStories();
  subscribeFeed();
  sb.auth.onAuthStateChange((event,s)=>{ if(event==='SIGNED_OUT'){session=null;me=null;location.reload();} });
}

function updateIdentity() {
  const node = $('headerAvatar');
  node.innerHTML=avatarHTML(me).replace(/^<span class="avatar[^"]*">/,'').replace(/<\/span>$/,'');
  node.className='avatar';
  node.style.cssText = 'width:32px; height:32px; font-size:14px; border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center;';
}

async function loadProfiles(ids) {
  const unique=[...new Set((ids||[]).filter(Boolean))].filter(id=>!profileCache[id]);
  if(unique.length) {
    const {data}=await sb.from('profiles').select('*').in('id',unique);
    (data||[]).forEach(p=>profileCache[p.id]=p);
  }
  return (ids||[]).map(id=>profileCache[id]||{id,full_name:'مستخدم'});
}

// ====== التنقل ======
function navigate(page) {
  activePage=page;
  document.querySelectorAll('.mobile-nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  
  $('homePage').classList.toggle('hidden',page!=='home');
  $('reelsPage').classList.toggle('hidden',page!=='reels');
  $('messagesPage').classList.toggle('hidden',page!=='messages');
  $('friendsPage').classList.toggle('hidden',page!=='friends');
  $('profilePage').classList.toggle('hidden',page!=='profile');
  
  if(page==='home') loadFeed();
  if(page==='reels') renderReels();
  if(page==='messages') renderMessages();
  if(page==='friends') renderFriends();
  if(page==='profile') renderProfile();
}
document.addEventListener('click', e => {
  const page = e.target.closest('[data-page]');
  if (page) navigate(page.dataset.page);
});
$('profileShortcut').addEventListener('click',()=>navigate('profile'));
$('headerNotifications').addEventListener('click',()=>navigate('friends'));

// ====== المنشورات ======
$('postImageFile').addEventListener('change', () => {
  const file = $('postImageFile').files?.[0];
  if (!file) { $('imagePreviewWrap').classList.add('hidden'); return; }
  $('imagePreview').src = URL.createObjectURL(file);
  $('imagePreviewWrap').classList.remove('hidden');
});
$('removePostImage').addEventListener('click', () => {
  $('postImageFile').value = '';
  $('imagePreviewWrap').classList.add('hidden');
});

$('publishBtn').addEventListener('click', async () => {
  const content = $('postText').value.trim();
  const file = $('postImageFile').files?.[0];
  if (!content && !file) return toast('اكتب حاجة أو اختار صورة الأول.');
  const btn = $('publishBtn'); btn.disabled = true; btn.textContent = 'جاري النشر...';
  
  try {
    let imageUrl = null;
    if (file) {
      const ext = file.name.split('.').pop();
      const path = `${me.id}/${Date.now()}.${ext}`;
      const { error: upErr } = await sb.storage.from('post-images').upload(path, file);
      if (upErr) throw upErr;
      const { data } = sb.storage.from('post-images').getPublicUrl(path);
      imageUrl = data.publicUrl;
    }
    const { data: post, error: postErr } = await sb.from('posts').insert({ author_id: me.id, content }).select('id').single();
    if (postErr) throw postErr;
    if (imageUrl) {
      await sb.from('post_media').insert({ post_id: post.id, uploader_id: me.id, media_url: imageUrl, media_type: 'image', position: 0 });
    }
    $('postText').value = ''; $('postImageFile').value = ''; $('imagePreviewWrap').classList.add('hidden');
    toast('تم النشر بنجاح 💙'); await loadFeed();
  } catch (err) { toast('النشر فشل: ' + userError(err)); }
  finally { btn.disabled = false; btn.textContent = 'نشر'; }
});

async function loadFeed() {
  const feed = $('feed');
  feed.innerHTML = '<div class="empty">بنجهّز آخر المنشورات…</div>';
  const { data: posts, error } = await sb.from('posts').select('*').is('deleted_at', null).order('created_at', { ascending: false }).limit(50);
  if (error) { feed.innerHTML = `<div class="empty">مش قادرين نحمّل المنشورات.</div>`; return; }
  if (!posts?.length) { feed.innerHTML = '<div class="empty">لسه مفيش منشورات. ابدأ الحكاية!</div>'; return; }
  
  const postIds = posts.map(p => p.id);
  const { data: mediaRows } = await sb.from('post_media').select('*').in('post_id', postIds);
  const mediaByPost = {};
  (mediaRows || []).forEach(m => { if (m.media_type === 'image' && !mediaByPost[m.post_id]) mediaByPost[m.post_id] = m.media_url; });
  await loadProfiles(posts.map(p => p.author_id));
  const { data: likes } = await sb.from('likes').select('*').in('post_id', postIds);
  const likeRows = likes || [];
  
  feed.innerHTML = posts.map(post => {
    const author = profileCache[post.author_id] || { full_name: 'مستخدم' };
    const postLikes = likeRows.filter(l => l.post_id === post.id);
    const img = safeImage(mediaByPost[post.id] || '');
    const isLiked = postLikes.some(l => l.user_id === me.id);
    
    return `<article class="post-card" data-post="${post.id}">
      <div class="post-header">
        ${avatarHTML(author)}
        <div class="post-meta">
          <span class="post-author">${displayName(author)}</span>
          <span class="post-time">${escapeHTML(timeAgo(post.created_at))}</span>
        </div>
        ${post.author_id === me.id ? '<button class="more" data-delete-post="'+post.id+'" style="margin-right:auto; background:none; color:#94a3b8; font-size:20px;">⋯</button>' : ''}
      </div>
      ${post.content ? `<div class="post-content">${escapeHTML(post.content)}</div>` : ''}
      ${img ? `<img class="post-image" loading="lazy" src="${escapeHTML(img)}" alt="صورة">` : ''}
      <div class="post-actions">
        <button class="post-action ${isLiked ? 'liked' : ''}" data-like="${post.id}">
          <span>${isLiked ? '❤️' : '🤍'}</span>
          <span>${postLikes.length}</span>
        </button>
        <button class="post-action" data-open-comments="${post.id}">
          <span>💬</span>
        </button>
        <button class="post-action" data-share="${post.id}">
          <span>↗️</span>
        </button>
      </div>
    </article>`;
  }).join('');
}

$('feed').addEventListener('click', async e => {
  const like = e.target.closest('[data-like]');
  if (like) {
    const postId = like.dataset.like;
    like.disabled = true;
    const { data: existing } = await sb.from('likes').select('post_id').eq('post_id', postId).eq('user_id', me.id).maybeSingle();
    if (existing) await sb.from('likes').delete().eq('post_id', postId).eq('user_id', me.id);
    else await sb.from('likes').insert({ post_id: postId, user_id: me.id });
    await loadFeed();
    return;
  }
  const del = e.target.closest('[data-delete-post]');
  if (del && confirm('متأكد إنك عايز تحذف المنشور؟')) {
    await sb.from('posts').delete().eq('id', del.dataset.deletePost).eq('author_id', me.id);
    toast('تم حذف المنشور');
    loadFeed();
  }
});

// ====== القصص ======
async function loadStories() {
  const row = $('storiesRow');
  const { data: stories } = await sb.from('stories').select('*').gt('expires_at', new Date().toISOString()).order('created_at', { ascending: false }).limit(60);
  
  const addButton = `<button type="button" class="story add" id="addStoryBtn"><div class="story-ring"><div class="avatar" style="display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--border);">＋</div></div><span>أضف قصة</span></button>`;
  const byUser = new Map();
  (stories || []).forEach(s => {
    if (!byUser.has(s.user_id)) byUser.set(s.user_id, []);
    byUser.get(s.user_id).push(s);
  });
  await loadProfiles([...byUser.keys()]);
  
  const otherCards = [...byUser.keys()].filter(id => id !== me.id).map(id => {
    const p = profileCache[id] || { full_name: 'صديق' };
    return `<button type="button" class="story" data-open-story-user="${id}">
      <div class="story-ring">${avatarHTML(p)}</div>
      <span>${escapeHTML((p.full_name||'').split(' ')[0])}</span>
    </button>`;
  });
  
  const ownCard = byUser.has(me.id) ? `<button type="button" class="story" data-open-story-user="${me.id}">
      <div class="story-ring">${avatarHTML(me)}</div>
      <span>قصتي</span>
    </button>` : '';
    
  row.innerHTML = addButton + ownCard + otherCards.join('');
  
  $('addStoryBtn')?.addEventListener('click', () => $('storyFileInput')?.click());
  row.querySelectorAll('[data-open-story-user]').forEach(btn => btn.addEventListener('click', () => openStoryViewer(btn.dataset.openStoryUser, byUser)));
}

async function openStoryViewer(userId, byUser) {
  const items = byUser.get(userId) || [];
  if (!items.length) return toast('لا توجد قصة.');
  let index = 0;
  const render = () => {
    const st = items[index];
    const profile = profileCache[userId] || (userId === me.id ? me : { full_name: 'مستخدم' });
    const media = st.media_type === 'video'
      ? `<video src="${escapeHTML(safeImage(st.media_url))}" controls autoplay playsinline style="width:100%;max-height:60vh;border-radius:14px;background:#111"></video>`
      : `<img src="${escapeHTML(safeImage(st.media_url))}" style="width:100%;max-height:60vh;object-fit:contain;border-radius:14px;background:#111">`;
    $('modalRoot').innerHTML = `<div class="modal-backdrop" id="storyBackdrop">
      <div class="modal">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
          <div style="display:flex;align-items:center;gap:10px">${avatarHTML(profile)}<strong>${displayName(profile)}</strong></div>
          <button id="closeStoryViewer" style="background:none;color:white;font-size:24px;">×</button>
        </div>
        ${media}
        <div style="display:flex;justify-content:space-between;margin-top:15px">
          <button id="prevStory" class="primary-btn" style="padding:10px;flex:1;margin-right:5px" ${index===0?'disabled':''}>السابق</button>
          <button id="nextStory" class="primary-btn" style="padding:10px;flex:1;margin-left:5px">${index===items.length-1?'إغلاق':'التالي'}</button>
        </div>
      </div>
    </div>`;
    $('closeStoryViewer').onclick = () => $('modalRoot').innerHTML = '';
    $('prevStory').onclick = () => { if(index>0){index--;render();} };
    $('nextStory').onclick = () => { if(index<items.length-1){index++;render();} else $('modalRoot').innerHTML=''; };
  };
  render();
}

// ====== الملف الشخصي ======
async function renderProfile() {
  const host = $('profilePage');
  host.innerHTML = `<div class="profile-header">
    <div class="profile-top">
      <div class="profile-avatar-wrap">${avatarHTML(me)}</div>
      <div class="profile-stats">
        <div class="stat"><strong id="profilePostCount">—</strong><span>منشورات</span></div>
        <div class="stat"><strong id="profileFriendCount">—</strong><span>أصدقاء</span></div>
        <div class="stat"><strong id="profileReelCount">—</strong><span>ريلز</span></div>
      </div>
    </div>
    <div class="profile-bio">
      <h2>${escapeHTML(me.full_name||'مستخدم')}${me.is_verified?'<span class="verified-badge">✓</span>':''}</h2>
      <p>${escapeHTML(me.bio||'مرحبًا بك في ملفي الشخصي على وَصْل ✨')}</p>
    </div>
    <div class="profile-buttons">
      <button id="editProfileBtn" class="primary">تعديل الملف</button>
    </div>
    <div class="profile-highlights" id="profileHighlights"></div>
    <div class="profile-tabs">
      <button class="profile-tab active" data-profile-tab="all">▦</button>
      <button class="profile-tab" data-profile-tab="images">🖼️</button>
      <button class="profile-tab" data-profile-tab="reels">▶️</button>
    </div>
    <div id="myPosts" class="profile-grid"></div>
  </div>`;

  $('editProfileBtn').addEventListener('click', () => showEditProfile());

  const { data: posts, error } = await sb.from('posts').select('*').eq('author_id', me.id).is('deleted_at', null).order('created_at', { ascending: false }).limit(60);
  const postIds = (posts||[]).map(p => p.id);
  let mediaRows = [];
  if (postIds.length) {
    const { data: media } = await sb.from('post_media').select('*').in('post_id', postIds);
    mediaRows = media || [];
  }
  const mediaByPost = {};
  mediaRows.forEach(m => { if (!mediaByPost[m.post_id]) mediaByPost[m.post_id] = m; });
  
  const { count: friendCount } = await sb.from('friendships').select('id', { count: 'exact', head: true }).or(`requester_id.eq.${me.id},addressee_id.eq.${me.id}`).eq('status', 'accepted');
  const { count: reelCount } = await sb.from('reels').select('id', { count: 'exact', head: true }).eq('user_id', me.id);
  
  $('profilePostCount').textContent = String(posts?.length || 0);
  $('profileFriendCount').textContent = String(friendCount || 0);
  $('profileReelCount').textContent = String(reelCount || 0);

  const highlights = mediaRows.filter(m => m.media_type === 'image' && safeImage(m.media_url)).slice(0, 5);
  $('profileHighlights').innerHTML = highlights.map(m => `<div class="highlight-item" data-highlight-image="${escapeHTML(m.media_url)}"><img src="${escapeHTML(safeImage(m.media_url))}" alt="Highlight"></div>`).join('');

  const gallery = $('myPosts');
  if (!posts?.length) {
    gallery.innerHTML = '<div class="empty" style="grid-column:1/-1;">لا توجد منشورات بعد</div>';
  } else {
    gallery.innerHTML = posts.map(p => {
      const m = mediaByPost[p.id];
      const src = m ? safeImage(m.media_url) : '';
      return `<div class="grid-item" data-profile-post="${escapeHTML(p.id)}">
        ${src ? (m.media_type === 'video' ? `<video src="${escapeHTML(src)}" muted playsinline></video>` : `<img src="${escapeHTML(src)}" alt="">`) : `<div style="padding:10px;font-size:12px;height:100%;background:#1e293b;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical">${escapeHTML(p.content||'')}</div>`}
      </div>`;
    }).join('');
  }

  host.querySelectorAll('[data-profile-tab]').forEach(btn => btn.onclick = () => {
    host.querySelectorAll('[data-profile-tab]').forEach(b => b.classList.toggle('active', b === btn));
    const kind = btn.dataset.profileTab;
    host.querySelectorAll('.grid-item').forEach(item => {
      item.style.display = (kind === 'all' || (kind === 'images' && !item.querySelector('video')) || (kind === 'reels' && item.querySelector('video'))) ? '' : 'none';
    });
  });
}

// ====== الريلز ======
async function renderReels() {
  const host = $('reelsFeed');
  $('uploadReelBtn').onclick = () => $('reelFileInput').click();
  $('reelFileInput').onchange = () => {
    const f = $('reelFileInput').files?.[0];
    if (!f) return;
    if (f.size > 150*1024*1024) return toast('حجم الفيديو الأقصى 150 ميجابايت.');
    $('reelUploadForm').classList.remove('hidden');
  };
  
  $('reelUploadForm').onsubmit = async e => {
    e.preventDefault();
    const f = $('reelFileInput').files?.[0];
    if (!f || !me) return;
    const btn = $('publishReelBtn');
    btn.disabled = true; btn.textContent = 'جاري الرفع...';
    try {
      const ext = f.name.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g,'') || 'mp4';
      const path = `${me.id}/${crypto.randomUUID()}.${ext}`;
      const { error: upErr } = await sb.storage.from('wasl-reels').upload(path, f, { contentType: f.type });
      if (upErr) throw upErr;
      const { data: u } = sb.storage.from('wasl-reels').getPublicUrl(path);
      const { error: dbErr } = await sb.from('reels').insert({ user_id: me.id, video_url: u.publicUrl, caption: $('reelCaption').value.trim() || null });
      if (dbErr) throw dbErr;
      toast('تم نشر الريل بنجاح 🎬');
      $('reelUploadForm').classList.add('hidden');
      await renderReels();
    } catch (err) { toast('تعذر النشر: ' + userError(err)); }
    finally { btn.disabled = false; btn.textContent = 'نشر'; }
  };

  const { data, error } = await sb.from('reels').select('*').eq('status', 'published').order('created_at', { ascending: false }).limit(50);
  if (error) { host.innerHTML = '<div class="empty">تعذر تحميل الريلز</div>'; return; }
  
  reelsCache = data || [];
  if (!reelsCache.length) { host.innerHTML = '<div class="empty">لا توجد ريلز</div>'; return; }
  
  await loadProfiles(reelsCache.map(r => r.user_id));
  const { data: likes } = await sb.from('reel_likes').select('*').in('reel_id', reelsCache.map(r => r.id));
  const ls = likes || [];

  host.innerHTML = reelsCache.map(r => {
    const p = profileCache[r.user_id] || { full_name: 'مستخدم' };
    const count = ls.filter(l => l.reel_id === r.id).length;
    const liked = ls.some(l => l.reel_id === r.id && l.user_id === me.id);
    return `<div class="reel-item">
      <video class="reel-video" src="${escapeHTML(safeImage(r.video_url))}" loop playsinline muted></video>
      <div class="reel-overlay">
        <div class="reel-info">
          <div class="reel-user">${avatarHTML(p)}<strong>${displayName(p)}</strong></div>
          <div class="reel-desc">${escapeHTML(r.caption || '')}</div>
        </div>
        <div class="reel-actions">
          <button class="reel-action-btn ${liked ? 'liked' : ''}" data-reel-like="${r.id}">
            <span>${liked ? '❤️' : '🤍'}</span><span>${count}</span>
          </button>
        </div>
      </div>
    </div>`;
  }).join('');

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const video = entry.target.querySelector('video');
      if (entry.isIntersecting) video.play().catch(()=>{});
      else video.pause();
    });
  }, { threshold: 0.6 });
  document.querySelectorAll('.reel-item').forEach(item => observer.observe(item));
}

$('reelsFeed').addEventListener('click', async e => {
  const like = e.target.closest('[data-reel-like]');
  if (like) {
    const id = like.dataset.reelLike;
    const { data: existing } = await sb.from('reel_likes').select('id').eq('reel_id', id).eq('user_id', me.id).maybeSingle();
    if (existing) await sb.from('reel_likes').delete().eq('id', existing.id);
    else await sb.from('reel_likes').insert({ reel_id: id, user_id: me.id });
    renderReels();
  }
});

// ====== الأصدقاء ======
async function renderFriends() {
  const { data: rows, error } = await sb.from('friendships').select('*').or(`requester_id.eq.${me.id},addressee_id.eq.${me.id}`).eq('status', 'accepted');
  if (error) { $('friendList').innerHTML = '<div class="empty">تعذر التحميل</div>'; return; }
  const ids = (rows||[]).map(r => r.requester_id === me.id ? r.addressee_id : r.requester_id);
  await loadProfiles(ids);
  $('friendList').innerHTML = ids.length ? ids.map(id => {
    const p = profileCache[id] || {};
    return `<div style="display:flex; align-items:center; gap:10px; padding:10px; border-bottom:1px solid var(--border);">
      ${avatarHTML(p)}
      <div style="flex:1"><strong>${displayName(p)}</strong></div>
    </div>`;
  }).join('') : '<div class="empty">لا يوجد أصدقاء بعد.</div>';
}

// ====== الرسائل والصوت ======
async function renderMessages() {
  const { data: rows, error } = await sb.from('friendships').select('*').eq('status', 'accepted').or(`requester_id.eq.${me.id},addressee_id.eq.${me.id}`);
  if (error) { $('chatList').innerHTML = '<div class="empty">تعذر تحميل الأصدقاء.</div>'; return; }
  const ids = (rows||[]).map(r => r.requester_id === me.id ? r.addressee_id : r.requester_id);
  await loadProfiles(ids);
  
  $('chatList').innerHTML = ids.length ? ids.map(id => `<button class="chat-person ${currentChatUser===id?'active':''}" data-chat-user="${id}">${avatarHTML(profileCache[id])}<span>${displayName(profileCache[id])}</span></button>`).join('') : '<div class="empty">أضف أصدقاء للمحادثة</div>';
  
  if (ids.length && !currentChatUser) { currentChatUser = ids[0]; }
  if (currentChatUser) await openChat(currentChatUser);
}

document.addEventListener('click', async e => {
  const u = e.target.closest('[data-chat-user]');
  if (u) { currentChatUser = u.dataset.chatUser; await renderMessages(); }
});

async function openChat(otherId) {
  const p = profileCache[otherId] || { full_name: 'صديق' };
  $('chatHeader').innerHTML = `محادثة مع ${displayName(p)}`;
  $('chatInput').disabled = false; $('chatSend').disabled = false; $('recordVoiceBtn').disabled = false;

  const { data: messages, error } = await sb.from('messages').select('*').or(`and(sender_id.eq.${me.id},receiver_id.eq.${otherId}),and(sender_id.eq.${otherId},receiver_id.eq.${me.id})`).order('created_at', { ascending: true }).limit(100);
  
  if (error) {
    $('chatMessages').innerHTML = `<div class="empty">تعذر تحميل الرسائل.<br>${escapeHTML(userError(error))}</div>`; return;
  }

  $('chatMessages').innerHTML = messages?.length ? messages.map(m => {
    const isMine = m.sender_id === me.id;
    // التحقق مما إذا كانت الرسالة رابط صوتي
    const isAudio = m.content && (m.content.includes('.webm') || m.content.includes('.mp4') || m.content.includes('.ogg') || m.content.includes('.m4a'));
    
    return `<div class="bubble ${isMine ? 'mine' : ''}">
      ${isAudio ? `<audio controls src="${escapeHTML(m.content)}"></audio>` : escapeHTML(m.content)}
      <small style="display:block;opacity:0.6;font-size:10px;margin-top:4px;">${escapeHTML(timeAgo(m.created_at))}</small>
    </div>`;
  }).join('') : '<div class="empty">ابدأوا أول محادثة 💙</div>';
  
  $('chatMessages').scrollTop = $('chatMessages').scrollHeight;

  $('chatForm').onsubmit = async e => {
    e.preventDefault();
    const input = $('chatInput'), content = input.value.trim();
    if (!content) return;
    input.value = '';
    const { error } = await sb.from('messages').insert({ sender_id: me.id, receiver_id: currentChatUser, content });
    if (error) { toast('فشل الإرسال: ' + userError(error)); input.value = content; }
    else await openChat(currentChatUser);
  };

  if (messageChannel) sb.removeChannel(messageChannel);
  messageChannel = sb.channel('messages-'+me.id+'-'+otherId).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
    const m = payload.new;
    if ((m.sender_id === me.id && m.receiver_id === otherId) || (m.sender_id === otherId && m.receiver_id === me.id)) openChat(otherId);
  }).subscribe();
}

// ====== تسجيل وإرسال الرسائل الصوتية (حل مشكلة webm) ======
$('recordVoiceBtn').addEventListener('click', async () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    $('recordVoiceBtn').classList.remove('recording');
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    
    // تحديد أفضل صيغة مدعومة لتجنب خطأ mime type
    let options = {};
    if (MediaRecorder.isTypeSupported('audio/webm')) options = { mimeType: 'audio/webm' };
    else if (MediaRecorder.isTypeSupported('audio/mp4')) options = { mimeType: 'audio/mp4' };
    else if (MediaRecorder.isTypeSupported('audio/ogg')) options = { mimeType: 'audio/ogg' };
    
    mediaRecorder = new MediaRecorder(stream, options);
    audioChunks = [];

    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = async () => {
      const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
      const ext = mediaRecorder.mimeType.includes('mp4') ? 'mp4' : mediaRecorder.mimeType.includes('ogg') ? 'ogg' : 'webm';
      const path = `${me.id}/voices/${Date.now()}.${ext}`;
      
      toast('جاري رفع الرسالة الصوتية...');
      const { error: upErr } = await sb.storage.from('post-images').upload(path, audioBlob, { contentType: mediaRecorder.mimeType });
      
      if (upErr) {
        toast('فشل رفع الصوت: ' + userError(upErr));
      } else {
        const { data } = sb.storage.from('post-images').getPublicUrl(path);
        await sb.from('messages').insert({ sender_id: me.id, receiver_id: currentChatUser, content: data.publicUrl });
        await openChat(currentChatUser);
      }
      stream.getTracks().forEach(track => track.stop());
    };

    mediaRecorder.start();
    $('recordVoiceBtn').classList.add('recording');
    toast('جاري التسجيل... اضغط مرة أخرى للإرسال');
    
  } catch (err) {
    toast('تعذر الوصول للميكروفون: ' + err.message);
  }
});

// ====== بدء التطبيق ======
async function start() {
  if (!sb) return;
  const { data: { session: existing } } = await sb.auth.getSession();
  if (existing) await boot(existing);
  else $('authScreen').classList.remove('hidden');
}
start();

})();
</script>
